<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAPER &amp; MORE – ระบบบัญชีสมุดรายวันเฉพาะ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f4d3a;--g2:#2f6b52;--on:#fff;--cream:#f6f0e1;--bg:#fbf8f0;--card:#fff;--tx:#1d2b24;--mut:#6b7a72;--line:#e3dccb;--red:#b3392f;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--g:#7fc4a0;--g2:#5aa882;--on:#10281d;--cream:#26302a;--bg:#161c18;--card:#1e2621;--tx:#ecefe9;--mut:#9aa89f;--line:#33403a;--red:#ff8a7d;--ok:#7fd1a0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Sarabun,system-ui,sans-serif}
header{background:var(--g);color:var(--on);padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font:700 22px Fraunces,Sarabun,serif;letter-spacing:.5px}header small{display:block;opacity:.85;font:400 13px Sarabun}
.hb button{background:var(--cream);color:var(--g);margin-left:6px}
.app{display:grid;grid-template-columns:1fr}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--cream);border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--tx);font-weight:600}
nav a.on{background:var(--g);color:var(--on)}nav i{display:none;font-style:normal;color:var(--mut);font-size:12px;margin:10px 0 2px 12px}
main{padding:16px;min-width:0}
@media(min-width:900px){.app{grid-template-columns:240px 1fr;min-height:calc(100vh - 70px)}nav{flex-direction:column;border-right:1px solid var(--line);border-bottom:0;padding:14px 10px}nav i{display:block}}
h2{font:700 22px Fraunces,Sarabun,serif;color:var(--g);margin:0 0 12px}h3{margin:0 0 10px;color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--g);border-radius:10px;padding:12px}
.st b{display:block;font-size:20px}.st span{color:var(--mut);font-size:13px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}.w{grid-column:1/-1}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
button{font:600 14px Sarabun;border:0;border-radius:8px;padding:8px 14px;background:var(--g);color:var(--on);cursor:pointer}
button.s{background:var(--cream);color:var(--g);border:1px solid var(--line)}button.d{background:var(--red);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--cream);color:var(--g);white-space:nowrap}
.r{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700;background:var(--cream)}
.fl{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}.fl.ok{background:var(--cream);color:var(--ok);border:1px solid var(--ok)}.fl.er{background:var(--cream);color:var(--red);border:1px solid var(--red)}
.ck{display:flex;gap:8px;padding:5px 0}.y{color:var(--ok)}.n{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.mut{color:var(--mut)}
</style></head><body>
<header><div><h1>PAPER &amp; MORE</h1><small>ร้านเครื่องเขียนและอุปกรณ์การเรียน · งวดบัญชี 1–31 มกราคม 2569</small></div>
<div class="hb"><button onclick="act('smp')" id="bs">โหลดตัวอย่าง</button><button onclick="act('clr')" id="bc">ล้างข้อมูล</button></div></header>
<div class="app"><nav id="nv"></nav><main id="m"></main></div>
<script>
const ACC={101:['เงินสด','D'],102:['ลูกหนี้การค้า','D'],103:['สินค้าคงเหลือ','D'],201:['เจ้าหนี้การค้า','C'],301:['ทุนเจ้าของกิจการ','C'],401:['รายได้จากการขาย','C'],402:['รับคืนสินค้าและส่วนลด','D'],501:['ต้นทุนขาย','D'],502:['ค่าเช่าร้าน','D'],503:['ค่าสาธารณูปโภค','D']};
const BOOKS={P:'สมุดรายวันซื้อ',S:'สมุดรายวันขาย',R:'สมุดรายวันรับเงิน',C:'สมุดรายวันจ่ายเงิน',G:'สมุดรายวันทั่วไป'};
const KINDS={P:{credit:'ซื้อสินค้าเป็นเงินเชื่อ',cash:'ซื้อสินค้าเป็นเงินสด'},S:{credit:'ขายสินค้าเป็นเงินเชื่อ',cash:'ขายสินค้าเป็นเงินสด'},R:{ar:'รับชำระหนี้จากลูกหนี้'},C:{ap:'จ่ายชำระหนี้เจ้าหนี้',e502:'จ่ายค่าเช่าร้าน',e503:'จ่ายค่าสาธารณูปโภค'},G:{cap:'เจ้าของนำเงินมาลงทุน',sret:'รับคืนสินค้าจากลูกค้า',pret:'ส่งคืนสินค้าให้ผู้จำหน่าย',man:'รายการอื่น (กำหนดเอง)'}};
const PREF={P:'PJ',S:'SJ',R:'CR',C:'CP',G:'GJ'};
const $=s=>document.querySelector(s),K='pm_acc_v1';
let D,view='dash',edit=null,flash=null,pend=null,subT='c',lsel='all',cb='P';
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}
if(!D||!D.entries)D={entries:[],log:[],n:1,products:[{id:'p1',name:'สมุดโน้ต',cost:20,price:35},{id:'p2',name:'ปากกาลูกลื่น',cost:5,price:10},{id:'p3',name:'ดินสอ',cost:4,price:8},{id:'p4',name:'แฟ้มเอกสาร',cost:15,price:25}]}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
const fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bd=i=>{const d=i.split('-');return +d[2]+'/'+d[1]+'/'+(+d[0]+543)};
const r2=x=>Math.round(x*100)/100,pn=p=>(D.products.find(x=>x.id==p)||{}).name||p;
const sorted=es=>[...es].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
const PK=['credit','cash','sret','pret'];
// สร้างรายการบัญชี [รหัส, เดบิต, เครดิต, คู่ค้า] และผลต่อสินค้า จากข้อมูลที่กรอก
function gen(e){const k=e.kind,q=+e.qty||0,c=+e.cost||0,pr=+e.price||0,p=e.party||'';let a=+e.amount||0,L=[],S={};
if(k=='credit'||k=='cash'){if(e.book=='P'){a=q*c;L=[[103,a,0],[k=='credit'?201:101,0,a,k=='credit'?p:'']];S[e.pid]=q}
else{a=q*pr;const t=q*c;L=[[k=='credit'?102:101,a,0,k=='credit'?p:''],[401,0,a],[501,t,0],[103,0,t]];S[e.pid]=-q}}
else if(k=='ar')L=[[101,a,0],[102,0,a,p]];
else if(k=='ap')L=[[201,a,0,p],[101,0,a]];
else if(k=='e502'||k=='e503')L=[[+k.slice(1),a,0],[101,0,a]];
else if(k=='cap')L=[[101,a,0],[301,0,a]];
else if(k=='sret'){a=q*pr;const t=q*c;L=[[402,a,0],[102,0,a,p],[103,t,0],[501,0,t]];S[e.pid]=q}
else if(k=='pret'){a=q*c;L=[[201,a,0,p],[103,0,a]];S[e.pid]=-q}
else{const m=x=>(x==102||x==201)?p:'';L=[[+e.dr,a,0,m(+e.dr)],[+e.cr,0,a,m(+e.cr)]]}
return{L,S,a}}
function validate(es){const er=[],st={},ar={},ap={};
for(const e of sorted(es)){const g=gen(e);let d=0,c=0;g.L.forEach(l=>{d+=l[1];c+=l[2]});
if(r2(d)!=r2(c))er.push(e.doc+': เดบิตไม่เท่ากับเครดิต');
for(const p in g.S){st[p]=(st[p]||0)+g.S[p];if(st[p]<0)er.push(`${e.doc}: สินค้า "${pn(p)}" คงเหลือติดลบ`)}
g.L.forEach(l=>{if(l[0]==102||l[0]==201){if(!l[3]){er.push(e.doc+': ไม่ระบุชื่อคู่ค้าสำหรับบัญชีคุม');return}
const m=l[0]==102?ar:ap;m[l[3]]=r2((m[l[3]]||0)+(l[0]==102?l[1]-l[2]:l[2]-l[1]));if(m[l[3]]<0)er.push(`${e.doc}: ยอดคงเหลือของ "${l[3]}" ติดลบ (รับ/จ่าย/คืนเกินยอดหนี้)`)}})}
return[...new Set(er)]}
// บัญชีแยกประเภท: ผ่านรายการจากสมุดรายวันทุกเล่ม (คำนวณใหม่จากรายการจริงทุกครั้ง จึงไม่มีการผ่านซ้ำ)
function led(){const m={};for(const a in ACC)m[a]=[];for(const e of sorted(D.entries))gen(e).L.forEach(l=>m[l[0]].push({e,dr:l[1],cr:l[2],p:l[3]||''}));return m}
const net=rows=>rows.reduce((s,r)=>s+r.dr-r.cr,0);
const bal=(rows,a)=>ACC[a][1]=='D'?net(rows):-net(rows);
function stockQ(){const s={};D.products.forEach(p=>s[p.id]=0);D.entries.forEach(e=>{const g=gen(e);for(const p in g.S)s[p]=(s[p]||0)+g.S[p]});return s}
function logp(e,t){D.log.unshift({t:new Date().toLocaleString('th-TH'),m:`${t} ${e.doc} (${BOOKS[e.book]}): `+gen(e).L.map(l=>(l[1]?'Dr ':'Cr ')+l[0]+' '+fmt(l[1]||l[2])).join(' / ')});D.log=D.log.slice(0,300)}
function fl(m,er){flash=[m,er];render()}
function fe(m){const b=$('#fb');if(b)b.innerHTML=`<div class="fl er">${esc(m)}</div>`}
// ---- เมนู
const NAV=[['dash','แดชบอร์ด'],['i','สมุดรายวัน'],['jP',BOOKS.P],['jS',BOOKS.S],['jR',BOOKS.R],['jC',BOOKS.C],['jG',BOOKS.G],['i','บัญชี'],['ledger','บัญชีแยกประเภททั่วไป'],['sub','บัญชีย่อยลูกหนี้/เจ้าหนี้'],['tb','งบทดลอง'],['stock','จัดการสินค้า'],['chk','ตรวจสอบ & ประวัติผ่านรายการ']];
function go(v){view=v;edit=null;pend=null;render();window.scrollTo(0,0)}
function render(){
$('#nv').innerHTML=NAV.map(n=>n[0]=='i'?`<i>${n[1]}</i>`:`<a class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
$('#bs').textContent=pend=='smp'?'ยืนยัน: แทนที่ด้วยตัวอย่าง':'โหลดตัวอย่าง';$('#bc').textContent=pend=='clr'?'ยืนยันล้างทั้งหมด':'ล้างข้อมูล';
if(view[0]=='j')cb=view[1];
$('#m').innerHTML=(flash?`<div class="fl ${flash[1]?'er':'ok'}">${esc(flash[0])}</div>`:'')+(view[0]=='j'?V.j():V[view]());flash=null;
if(view[0]=='j')fill()}
function act(k){if(D.entries.length&&pend!=k){pend=k;render();return}pend=null;
if(k=='clr'){D.entries=[];D.log=[];D.n=1;save();fl('ล้างรายการค้าทั้งหมดแล้ว')}else{sample();fl('โหลดรายการค้าตัวอย่างแล้ว ตรวจสอบได้ที่สมุดรายวันและงบทดลอง')}}
function sample(){D.n=1;const P=D.products;
const m=(book,date,kind,party,pi,qty,amount,desc)=>{const p=pi>=0?P[pi]:{};return{id:D.n++,book,date:'2026-01-'+date,doc:'',kind,party,pid:p.id,qty,cost:p.cost,price:p.price,amount,desc,dr:'',cr:''}};
const es=[m('G','01','cap','',-1,0,100000,'เจ้าของนำเงินสดมาลงทุน'),m('P','02','credit','บจก. กระดาษไทย',0,1000,0,'ซื้อสมุดโน้ตเชื่อ'),m('P','02','cash','ร้านปากกาดี',1,2000,0,'ซื้อปากกาลูกลื่นเงินสด'),m('P','03','credit','หจก. เครื่องเขียนรุ่งเรือง',2,1500,0,'ซื้อดินสอเชื่อ'),m('P','03','credit','หจก. เครื่องเขียนรุ่งเรือง',3,400,0,'ซื้อแฟ้มเอกสารเชื่อ'),
m('C','05','e502','',-1,0,8000,'จ่ายค่าเช่าร้านเดือนมกราคม'),m('S','06','credit','โรงเรียนสวนกุหลาบ',0,300,0,'ขายสมุดโน้ตเชื่อ'),m('S','07','cash','ลูกค้าทั่วไป',1,500,0,'ขายปากกาเงินสด'),m('S','10','credit','นายสมชาย ใจดี',3,100,0,'ขายแฟ้มเอกสารเชื่อ'),
m('R','12','ar','โรงเรียนสวนกุหลาบ',-1,0,5000,'รับชำระหนี้บางส่วน'),m('S','14','credit','โรงเรียนสวนกุหลาบ',2,200,0,'ขายดินสอเชื่อ'),m('G','15','sret','โรงเรียนสวนกุหลาบ',0,10,0,'รับคืนสมุดโน้ตชำรุด'),m('C','18','ap','บจก. กระดาษไทย',-1,0,10000,'จ่ายชำระหนี้บางส่วน'),m('G','20','pret','บจก. กระดาษไทย',0,20,0,'ส่งคืนสมุดโน้ตให้ผู้จำหน่าย'),m('C','25','e503','',-1,0,1500,'จ่ายค่าน้ำ-ค่าไฟ')];
es.forEach(e=>e.doc=PREF[e.book]+'-'+String(es.filter(x=>x.book==e.book&&x.id<=e.id).length).padStart(3,'0'));
D.entries=es;D.log=[];es.forEach(e=>logp(e,'ผ่านรายการ'));save()}
// ---- สมุดรายวัน
function jopts(b){return Object.entries(KINDS[b]).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
const aopts=[101,102,201,301,401,402,501,502,503].map(a=>`<option value="${a}">${a} ${ACC[a][0]}</option>`).join('');
function parties(a){return[...new Set(led()[a].map(r=>r.p).filter(Boolean))]}
const V={};
V.j=()=>{const b=cb,rows=sorted(D.entries.filter(e=>e.book==b));
return`<h2>${BOOKS[b]}</h2><div class="card"><h3>${edit?'แก้ไขรายการ':'เพิ่มรายการ'}</h3><div id="fb"></div>
<div class="fg" oninput="pv()"><label>วันที่<input type="date" id="f_date" min="2026-01-01" max="2026-01-31"></label>
<label>เลขที่เอกสาร<input id="f_doc"></label><label>ประเภทรายการ<select id="f_kind" onchange="fch()">${jopts(b)}</select></label>
<label id="l_party"><span id="t_party">ชื่อคู่ค้า</span><input id="f_party" list="dl"></label><datalist id="dl"></datalist>
<label id="l_pid">สินค้า<select id="f_pid">${D.products.map(p=>`<option value="${p.id}">${esc(p.name)} (ทุน ${p.cost} / ขาย ${p.price})</option>`).join('')}</select></label>
<label id="l_qty">จำนวน (หน่วย)<input type="number" id="f_qty" min="1" step="1" value="1"></label>
<label id="l_amt">จำนวนเงิน (บาท)<input type="number" id="f_amt" min="0" step="0.01"></label>
<label id="l_dr">บัญชีเดบิต<select id="f_dr">${aopts}</select></label><label id="l_cr">บัญชีเครดิต<select id="f_cr">${aopts}</select></label>
<label class="w">รายละเอียด<input id="f_desc"></label></div>
<div class="tw" id="pv"></div><p><button onclick="sv()">บันทึกรายการ</button> ${edit?'<button class="s" onclick="go(view)">ยกเลิกแก้ไข</button>':''}</p></div>
<div class="card"><h3>รายการที่บันทึกแล้ว (${rows.length})</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายละเอียด</th><th>คู่ค้า</th><th class="r">จำนวนเงิน</th><th>เดบิต</th><th>เครดิต</th><th></th></tr>
${rows.map(e=>{const g=gen(e),f=i=>g.L.filter(l=>l[i]).map(l=>`${l[0]} ${ACC[l[0]][0]} ${fmt(l[i])}`).join('<br>');
return`<tr><td>${bd(e.date)}</td><td>${esc(e.doc)}</td><td>${esc(e.desc)}</td><td>${esc(e.party)}</td><td class="r">${fmt(g.a)}</td><td>${f(1)}</td><td>${f(2)}</td><td><button class="s" onclick="ed(${e.id})">แก้ไข</button> <button class="${pend=='d'+e.id?'d':'s'}" onclick="del(${e.id})">${pend=='d'+e.id?'ยืนยันลบ':'ลบ'}</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mut">ยังไม่มีรายการ — กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า หรือเพิ่มรายการด้านบน</td></tr>'}</table></div></div>`};
function fill(){const e=D.entries.find(x=>x.id==edit),s=(i,v)=>{if(v!=null)$('#f_'+i).value=v};
if(e){s('date',e.date);s('doc',e.doc);s('kind',e.kind);s('party',e.party);s('pid',e.pid);s('qty',e.qty);s('amt',e.amount||'');s('dr',e.dr||101);s('cr',e.cr||101);s('desc',e.desc)}
else{s('date','2026-01-01');s('doc',PREF[cb]+'-'+String(D.entries.filter(x=>x.book==cb).length+1).padStart(3,'0'));s('dr',101);s('cr',301)}fch()}
function fch(){const k=$('#f_kind').value,b=cb,pk=PK.includes(k),sh=(i,v)=>$('#l_'+i).style.display=v?'':'none';
sh('pid',pk);sh('qty',pk);sh('amt',!pk);sh('dr',k=='man');sh('cr',k=='man');sh('party',!['e502','e503','cap'].includes(k));
const cu=b=='S'||k=='ar'||k=='sret',su=b=='P'||k=='ap'||k=='pret';
$('#t_party').textContent=(cu?'ชื่อลูกค้า':su?'ชื่อผู้จำหน่าย':'ชื่อคู่ค้า (ถ้ามีบัญชี 102/201)')+(k=='cash'?' (ไม่บังคับ)':'');
$('#dl').innerHTML=(cu?parties(102):su?parties(201):[...parties(102),...parties(201)]).map(p=>`<option value="${esc(p)}">`).join('');pv()}
function rf(){const g=i=>$('#f_'+i).value,p=D.products.find(x=>x.id==g('pid'))||{};
return{id:edit||D.n,book:cb,date:g('date'),doc:g('doc').trim(),kind:g('kind'),party:g('party').trim(),pid:p.id,qty:+g('qty')||0,cost:p.cost,price:p.price,amount:+g('amt')||0,dr:g('dr'),cr:g('cr'),desc:g('desc').trim()}}
function pv(){const g=gen(rf());$('#pv').innerHTML=g.a>0?`<table><tr><th>ตัวอย่างการบันทึกบัญชีอัตโนมัติ</th><th class="r">เดบิต</th><th class="r">เครดิต</th></tr>`+g.L.map(l=>`<tr><td>${l[1]?'':'&emsp;'}${l[0]} ${ACC[l[0]]?ACC[l[0]][0]:''}${l[3]?' ('+esc(l[3])+')':''}</td><td class="r">${l[1]?fmt(l[1]):''}</td><td class="r">${l[2]?fmt(l[2]):''}</td></tr>`).join('')+'</table>':''}
function sv(){const e=rf(),k=e.kind,pk=PK.includes(k),er=[];
if(!e.date||e.date<'2026-01-01'||e.date>'2026-01-31')er.push('วันที่ต้องอยู่ในรอบบัญชี 1–31 มกราคม 2569');
if(!e.doc)er.push('กรุณาระบุเลขที่เอกสาร');
if(D.entries.some(x=>x.book==cb&&x.doc==e.doc&&x.id!=e.id))er.push('เลขที่เอกสารซ้ำในสมุดนี้');
if(pk){if(!(e.qty>0)||e.qty%1)er.push('จำนวนสินค้าต้องเป็นจำนวนเต็มมากกว่า 0')}else if(!(e.amount>0))er.push('จำนวนเงินต้องมากกว่า 0');
if(k=='man'&&e.dr==e.cr)er.push('บัญชีเดบิตและเครดิตต้องต่างกัน');
if((['credit','ar','ap','sret','pret'].includes(k)||(k=='man'&&[e.dr,e.cr].some(x=>x==102||x==201)))&&!e.party)er.push('กรุณาระบุชื่อคู่ค้า');
if(['e502','e503','cap'].includes(k))e.party='';
if(er.length)return fe(er.join(' • '));
if(!e.desc)e.desc=KINDS[cb][k]+(pk?' '+pn(e.pid)+' '+e.qty+' หน่วย':'')+(e.party?' – '+e.party:'');
const old=D.entries.find(x=>x.id==e.id),next=old?D.entries.map(x=>x.id==e.id?e:x):[...D.entries,e],ve=validate(next);
if(ve.length)return fe('บันทึกไม่ได้: '+ve.join(' • '));
if(old){logp(old,'ย้อนกลับ');D.entries=next}else{D.entries=next;D.n++}
logp(e,'ผ่านรายการ');save();edit=null;fl('บันทึกรายการ '+e.doc+' และผ่านไปบัญชีแยกประเภทแล้ว')}
function ed(id){edit=id;render();window.scrollTo(0,0)}
function del(id){if(pend!='d'+id){pend='d'+id;return render()}pend=null;const e=D.entries.find(x=>x.id==id),next=D.entries.filter(x=>x.id!=id),ve=validate(next);
if(ve.length)return fl('ลบไม่ได้ เพราะจะทำให้เกิดความผิดพลาด: '+ve.join(' • '),1);
logp(e,'ย้อนกลับ (ลบ)');D.entries=next;save();fl('ลบรายการ '+e.doc+' และย้อนกลับการผ่านรายการแล้ว')}
// ---- รายงาน
const lrows=(a,rows)=>{let b=0;return rows.map(r=>{b+=ACC[a][1]=='D'?r.dr-r.cr:r.cr-r.dr;return`<tr><td>${bd(r.e.date)}</td><td>${esc(r.e.doc)}</td><td>${esc(r.e.desc)}</td><td class="r">${r.dr?fmt(r.dr):''}</td><td class="r">${r.cr?fmt(r.cr):''}</td><td class="r">${fmt(b)}</td></tr>`}).join('')};
V.ledger=()=>{const L=led(),list=lsel=='all'?Object.keys(ACC):[lsel];
return`<h2>บัญชีแยกประเภททั่วไป</h2><div class="tabs"><select onchange="lsel=this.value;render()"><option value="all">ทุกบัญชี</option>${Object.keys(ACC).map(a=>`<option value="${a}" ${lsel==a?'selected':''}>${a} ${ACC[a][0]}</option>`).join('')}</select></div>`+
list.map(a=>`<div class="card"><h3>${a} ${ACC[a][0]}</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th class="r">เดบิต</th><th class="r">เครดิต</th><th class="r">คงเหลือ</th></tr>${lrows(a,L[a])||'<tr><td colspan="6" class="mut">ไม่มีรายการ</td></tr>'}<tfoot><tr><td colspan="3">ยอดคงเหลือ</td><td class="r">${fmt(L[a].reduce((s,r)=>s+r.dr,0))}</td><td class="r">${fmt(L[a].reduce((s,r)=>s+r.cr,0))}</td><td class="r">${fmt(bal(L[a],a))}</td></tr></tfoot></table></div></div>`).join('')};
V.sub=()=>{const a=subT=='c'?102:201,rows=led()[a],ps={};rows.forEach(r=>(ps[r.p]=ps[r.p]||[]).push(r));let tot=0,h='';
for(const p in ps){let b=0;const sg=a==102?1:-1;
h+=`<div class="card"><h3>${esc(p)}</h3><div class="tw"><table><tr><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th class="r">เดบิต</th><th class="r">เครดิต</th><th class="r">คงเหลือ</th></tr>${ps[p].map(r=>{b+=sg*(r.dr-r.cr);return`<tr><td>${bd(r.e.date)}</td><td>${esc(r.e.doc)}</td><td>${esc(r.e.desc)}</td><td class="r">${r.dr?fmt(r.dr):''}</td><td class="r">${r.cr?fmt(r.cr):''}</td><td class="r">${fmt(b)}</td></tr>`}).join('')}</table></div></div>`;tot+=b}
const c=bal(rows,a),ok=r2(tot)==r2(c);
return`<h2>บัญชีย่อย${a==102?'ลูกหนี้':'เจ้าหนี้'}การค้า</h2><div class="tabs"><button class="${a==102?'':'s'}" onclick="subT='c';render()">ลูกหนี้ (ตามชื่อลูกค้า)</button><button class="${a==201?'':'s'}" onclick="subT='s';render()">เจ้าหนี้ (ตามชื่อผู้จำหน่าย)</button></div>
<div class="fl ${ok?'ok':'er'}">รวมบัญชีย่อย ${fmt(tot)} บาท · บัญชีคุม ${a} ${ACC[a][0]} ${fmt(c)} บาท — ${ok?'ตรงกัน ✓':'ไม่ตรงกัน ✗'}</div>`+(h||'<div class="card mut">ยังไม่มีรายการ — กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</div>')};
function tbData(){const L=led();let td=0,tc=0;const rows=Object.keys(ACC).map(a=>{const s=net(L[a]),d=s>0?s:0,c=s<0?-s:0;td+=d;tc+=c;return[a,ACC[a][0],d,c]});return{rows,td,tc,ok:r2(td)==r2(tc)}}
V.tb=()=>{const t=tbData();return`<h2>งบทดลอง</h2><div class="fl ${t.ok?'ok':'er'}">${t.ok?'✓ งบทดลองสมดุล: ยอดเดบิตเท่ากับยอดเครดิต':'⚠ งบทดลองไม่สมดุล! ผลต่าง '+fmt(Math.abs(t.td-t.tc))+' บาท กรุณาตรวจสอบสมุดรายวัน'}</div>
<div class="card"><div class="tw"><table><tr><th>รหัสบัญชี</th><th>ชื่อบัญชี</th><th class="r">ยอดเดบิต</th><th class="r">ยอดเครดิต</th></tr>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]?fmt(r[2]):''}</td><td class="r">${r[3]?fmt(r[3]):''}</td></tr>`).join('')}<tfoot><tr><td colspan="2">รวม</td><td class="r">${fmt(t.td)}</td><td class="r">${fmt(t.tc)}</td></tr></tfoot></table></div><p class="mut">สำหรับงวด 1–31 มกราคม 2569 · ดึงยอดคงเหลือจากบัญชีแยกประเภทโดยอัตโนมัติ</p></div>`};
V.stock=()=>{const s=stockQ();let tv=0;return`<h2>จัดการสินค้า (Perpetual Inventory)</h2><div class="card"><div class="tw"><table><tr><th>สินค้า</th><th class="r">ราคาทุน</th><th class="r">ราคาขาย</th><th class="r">คงเหลือ (หน่วย)</th><th class="r">มูลค่าตามราคาทุน</th></tr>${D.products.map(p=>{const v=s[p.id]*p.cost;tv+=v;return`<tr><td>${esc(p.name)}</td><td class="r">${fmt(p.cost)}</td><td class="r">${fmt(p.price)}</td><td class="r">${s[p.id]}</td><td class="r">${fmt(v)}</td></tr>`}).join('')}<tfoot><tr><td colspan="4">รวมมูลค่าสินค้าคงเหลือ (ต้องเท่ากับบัญชี 103: ${fmt(bal(led()[103],103))})</td><td class="r">${fmt(tv)}</td></tr></tfoot></table></div><p class="mut">ซื้อ/รับคืนจากลูกค้า = เพิ่มสินค้า · ขาย/ส่งคืนผู้จำหน่าย = ลดสินค้า ระบบไม่ให้ขายเกินจำนวนคงเหลือ</p></div>
<div class="card"><h3>เพิ่มสินค้าใหม่</h3><div class="fg"><label>ชื่อสินค้า<input id="n_n"></label><label>ราคาทุน<input type="number" id="n_c" min="0" step="0.01"></label><label>ราคาขาย<input type="number" id="n_p" min="0" step="0.01"></label></div><button onclick="addp()">เพิ่มสินค้า</button></div>`};
function addp(){const n=$('#n_n').value.trim(),c=+$('#n_c').value,p=+$('#n_p').value;if(!n||!(c>0)||!(p>0))return fl('กรอกชื่อ ราคาทุน และราคาขายให้ครบ (มากกว่า 0)',1);D.products.push({id:'p'+Date.now(),name:n,cost:c,price:p});save();fl('เพิ่มสินค้า '+n+' แล้ว')}
function checks(){const L=led(),t=tbData(),s=stockQ(),c=[];let d=0,cr=0;for(const a in L)L[a].forEach(r=>{d+=r.dr;cr+=r.cr});
c.push(['ยอดเดบิตรวมเท่ากับยอดเครดิตรวมในบัญชีแยกประเภท',r2(d)==r2(cr),fmt(d)+' / '+fmt(cr)]);
c.push(['งบทดลองสมดุล',t.ok,fmt(t.td)+' / '+fmt(t.tc)]);
for(const [a,n] of [[102,'ลูกหนี้'],[201,'เจ้าหนี้']]){const m={};L[a].forEach(r=>m[r.p]=(m[r.p]||0)+(a==102?r.dr-r.cr:r.cr-r.dr));const sum=Object.values(m).reduce((x,y)=>x+y,0);c.push([`บัญชีย่อย${n}รวมเท่ากับบัญชีคุม ${a}`,r2(sum)==r2(bal(L[a],a)),fmt(sum)+' / '+fmt(bal(L[a],a))])}
const sv=D.products.reduce((x,p)=>x+s[p.id]*p.cost,0);c.push(['มูลค่าสินค้าคงเหลือตามทะเบียนเท่ากับบัญชี 103',r2(sv)==r2(bal(L[103],103)),fmt(sv)+' / '+fmt(bal(L[103],103))]);
const ve=validate(D.entries);c.push(['ไม่มีสินค้าหรือยอดลูกหนี้/เจ้าหนี้ติดลบ และทุกรายการเดบิต=เครดิต',!ve.length,ve.join(' • ')||'ปกติ']);return c}
V.chk=()=>`<h2>ตรวจสอบความผิดพลาด</h2><div class="card">${checks().map(c=>`<div class="ck"><b class="${c[1]?'y':'n'}">${c[1]?'✓':'✗'}</b><div>${c[0]}<br><span class="mut">${esc(c[2])}</span></div></div>`).join('')}</div>
<div class="card"><h3>ประวัติการผ่านรายการ / ย้อนกลับ</h3>${D.log.map(l=>`<div class="ck"><span class="mut">${esc(l.t)}</span><span>${esc(l.m)}</span></div>`).join('')||'<span class="mut">ยังไม่มีประวัติ</span>'}</div>`;
V.dash=()=>{const L=led(),b=a=>bal(L[a],a),sales=b(401)-b(402),gp=sales-b(501),ex=b(502)+b(503),ni=gp-ex,ch=checks(),ok=ch.every(c=>c[1]);
const st=(l,v,x)=>`<div class="st"><span>${l}</span><b>${fmt(v)}</b>${x?`<span>${x}</span>`:''}</div>`;
return`<h2>ภาพรวมกิจการ</h2>`+(D.entries.length?'':`<div class="card" style="background:var(--cream)"><h3>เริ่มต้นใช้งาน</h3>กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า (ปุ่ม “โหลดตัวอย่าง” มุมขวาบน) หรือเริ่มบันทึกรายการเองที่เมนูสมุดรายวัน<p><button onclick="act('smp')">กดปุ่มโหลดตัวอย่างเพื่อดูรายการค้า</button></p></div>`)+
`<div class="grid">${st('เงินสด',b(101))}${st('ลูกหนี้การค้า',b(102))}${st('สินค้าคงเหลือ',b(103))}${st('เจ้าหนี้การค้า',b(201))}${st('ยอดขายสุทธิ',sales,'หลังหักรับคืน/ส่วนลด')}${st('ต้นทุนขาย',b(501))}${st('กำไรขั้นต้น',gp)}${st('ค่าใช้จ่าย',ex,'ค่าเช่า + สาธารณูปโภค')}${st('กำไร(ขาดทุน)สุทธิ',ni)}${st('ทุน + กำไรสะสม',b(301)+ni)}</div>
<div class="fl ${ok?'ok':'er'}">${ok?'✓ ผ่านการตรวจสอบทุกข้อ (เดบิต=เครดิต, บัญชีย่อย=บัญชีคุม, สินค้า=บัญชี 103)':'⚠ พบความผิดพลาด ดูรายละเอียดที่เมนู “ตรวจสอบ”'}</div>
<div class="card"><h3>วิธีใช้งาน</h3>1) เลือกสมุดรายวัน เลือกประเภทรายการ กรอกข้อมูล ระบบแสดงตัวอย่างเดบิต/เครดิต แล้วกดบันทึก<br>2) ระบบผ่านรายการไปบัญชีแยกประเภทและบัญชีย่อยให้อัตโนมัติ พร้อมปรับสินค้าคงเหลือและต้นทุนขาย<br>3) แก้ไข/ลบรายการ = ย้อนกลับของเดิมแล้วผ่านรายการใหม่ ไม่ซ้ำซ้อน<br>4) ดูงบทดลองและผลการตรวจสอบได้ทุกเมื่อ ข้อมูลถูกเก็บในเบราว์เซอร์นี้</div>`};
load();render();
</script></body></html>
